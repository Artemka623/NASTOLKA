<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настолка: онлайн</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2118;--mut:#7a6c5a;--acc:#d9482b;--acc2:#2b7a5f;--line:#e3d9c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#2a231b;--ink:#f3ead9;--mut:#a99a83;--acc:#ff7a59;--acc2:#58c29b;--line:#41372b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#2a231b;--ink:#f3ead9;--mut:#a99a83;--acc:#ff7a59;--acc2:#58c29b;--line:#41372b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin:6px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;margin:4px 4px 4px 0}
button.alt{background:var(--acc2)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.code{font-size:34px;letter-spacing:6px;font-weight:800;color:var(--acc)}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.task{font-size:22px;font-weight:700;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.stars button{width:52px;padding:12px 0;font-size:18px}
.mut{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<p class="mut" id="nb" style="text-align:center"></p>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var CARDS=[
["🎨","Нарисуйте «свидание на Луне» за 30 секунд — остальные угадывают, что это."],
["🎤","Спойте любую песню, заменив все слова на «ням-ням»."],
["🎭","Изобразите без слов любимую рекламу 2000-х."],
["🧠","Назовите 5 городов на букву «К» за 10 секунд."],
["🤥","Расскажите 2 правды и 1 ложь о себе — зал угадывает ложь."],
["🎨","Нарисуйте кота с закрытыми глазами."],
["🎤","Прочитайте новости как диктор, который сдерживает смех."],
["🎭","Покажите, как бы выглядел ваш первый рабочий день на Марсе."],
["🧠","Придумайте название для ужасной настолки про налоги."],
["🤥","Убедите всех, что вы умеете говорить с птицами."],
["🎤","Изобразите оперную певицу, застрявшую в лифте."],
["🎭","Сыграйте сцену: официант и клиент, который заказал «воздух»."],
["🧠","Придумайте 3 слогана для зубной щётки за 15 секунд."],
["🎨","Нарисуйте автопортрет другой рукой."]
];
var app=document.getElementById("app");
var room=null,myPeer=null,myName="",code="",isHost=false,S=null,joined=false,err="",status="";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function mkCode(){var l="ABCDEFGHJKLMNPQRSTUVWXYZ",s="";for(var i=0;i<4;i++)s+=l[Math.floor(Math.random()*l.length)];return s}
function bcast(){if(isHost&&sendMsg)sendMsg({t:"state",d:S})}

function render(){
  if(!S){
    app.innerHTML='<h1>🎲 Настолка</h1><p class="sub">Весёлые задания для компании. Каждый играет со своего телефона.</p>'+
    '<div class="card"><input id="nm" maxlength="16" placeholder="Ваше имя" value="'+esc(myName)+'">'+
    '<button data-a="create">Создать комнату</button></div>'+
    '<div class="card"><input id="cd" maxlength="4" placeholder="Код комнаты" style="text-transform:uppercase">'+
    '<button class="alt" data-a="join">Войти по коду</button></div>'+
    (status?'<p class="mut">'+esc(status)+'</p>':'')+(err?'<p style="color:var(--acc)">'+esc(err)+'</p>':'');
    return;
  }
  var ids=Object.keys(S.players),h='<h1>🎲 Настолка</h1><span class="tag">Комната '+esc(code)+'</span> ';
  var pf=S.order[S.turn],pn=pf&&S.players[pf]?S.players[pf].name:"";
  var isP=(pf===myPeer);
  if(S.phase==="lobby"){
    h+='<div class="card"><div class="mut">Код для друзей</div><div class="code">'+esc(code)+'</div></div><div class="card"><b>Игроки ('+ids.length+')</b>';
    ids.forEach(function(i){h+='<div class="row"><span>'+esc(S.players[i].name)+(i===S.host?" 👑":"")+'</span></div>'});
    h+='</div>';
    h+=isHost?'<button data-a="start"'+(ids.length<2?' disabled':'')+'>Начать игру</button><p class="mut">Нужно минимум 2 игрока.</p>':'<p class="mut">Ждём, пока хозяин начнёт игру…</p>';
  }else if(S.phase==="end"){
    h+='<div class="card"><b>🏆 Итоги</b>';
    ids.sort(function(a,b){return S.players[b].score-S.players[a].score}).forEach(function(i,k){h+='<div class="row"><span>'+(k+1)+'. '+esc(S.players[i].name)+'</span><b>'+S.players[i].score+'</b></div>'});
    h+='</div>'+(isHost?'<button data-a="again">Сыграть ещё</button>':'');
  }else{
    h+='<span class="tag">Раунд '+(S.turn+1)+' из '+S.order.length+'</span>';
    h+='<div class="card"><div class="mut">Выступает: <b>'+esc(pn)+(isP?" (вы)":"")+'</b></div><div class="task">'+S.card[0]+' '+esc(S.card[1])+'</div>';
    if(S.phase==="perform"){
      h+=isP?'<button data-a="done">Готово!</button>':'<p class="mut">Смотрим и ждём…</p>';
    }else if(S.phase==="vote"){
      if(isP)h+='<p class="mut">Зал выставляет оценки…</p>';
      else if(S.votes[myPeer]!=null)h+='<p class="mut">Ваша оценка: '+S.votes[myPeer]+' ⭐ Ждём остальных…</p>';
      else{h+='<p>Оцените выступление:</p><div class="stars">';for(var s=1;s<=5;s++)h+='<button class="alt" data-a="vote" data-s="'+s+'">'+s+'</button>';h+='</div>'}
    }else{
      h+='<p><b>Итог раунда: +'+S.gain+' очков</b> для '+esc(pn)+'</p>'+(isHost?'<button data-a="next">Дальше</button>':'<p class="mut">Ждём хозяина…</p>');
    }
    h+='</div><div class="card"><b>Счёт</b>';
    ids.sort(function(a,b){return S.players[b].score-S.players[a].score}).forEach(function(i){h+='<div class="row"><span>'+esc(S.players[i].name)+'</span><b>'+S.players[i].score+'</b></div>'});
    h+='</div>';
  }
  app.innerHTML=h;
}

function newCard(){S.card=rnd(CARDS);S.votes={};S.gain=0;S.phase="perform"}
function startGame(){
  var ids=Object.keys(S.players);ids.forEach(function(i){S.players[i].score=0});
  var o=ids.slice().sort(function(){return Math.random()-.5});S.order=o.concat(o.slice().sort(function(){return Math.random()-.5}));
  S.turn=0;newCard();
}
function checkVotes(){
  var pf=S.order[S.turn],need=Object.keys(S.players).filter(function(i){return i!==pf});
  if(need.every(function(i){return S.votes[i]!=null})){
    var t=0;need.forEach(function(i){t+=S.votes[i]});S.gain=t;if(S.players[pf])S.players[pf].score+=t;S.phase="result";
  }
}

var sendMsg=null,clients=[],seen={},topic="";
function rid(){return Math.random().toString(36).slice(2,10)}
function nbUpd(){var n=clients.filter(function(c){return c.connected}).length;document.getElementById("nb").textContent="Серверов на связи: "+n+" из "+clients.length}
function act(t,d){if(isHost)handle(myPeer,t,d);else if(sendMsg&&S&&S.host)sendMsg({t:t,d:d},S.host)}
function handle(p,t,d){
  if(t==="hello"){if(S.phase==="lobby"&&d&&d.n&&!S.players[p])S.players[p]={name:String(d.n).slice(0,16),score:0}}
  else if(t==="done"){if(S.phase==="perform"&&p===S.order[S.turn])S.phase="vote"}
  else if(t==="vote"){var v=Number(d&&d.s);if(S.phase==="vote"&&p!==S.order[S.turn]&&S.players[p]&&v>=1&&v<=5&&S.votes[p]==null){S.votes[p]=v;checkVotes()}}
  bcast();render();
}
function onMsg(m){
  if(isHost){if(m.t!=="state")handle(m.from,m.t,m.d)}
  else if(m.t==="state"&&m.d&&m.d.code===code&&m.from===m.d.host){S=m.d;render()}
}
function noServers(){return !clients.some(function(c){return c.connected})}
function enter(host){
  err="";isHost=host;
  if(!window.mqtt){err="Не загрузилась библиотека MQTT. Проверьте интернет.";S=null;status="";render();return}
  myPeer=rid()+rid();
  topic="nastolka-ru/"+code.toLowerCase()+"/m";
  sendMsg=function(m,to){m.id=rid();m.from=myPeer;if(to)m.to=to;var p=JSON.stringify(m);clients.forEach(function(c){if(c.connected)c.publish(topic,p)})};
  ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"].forEach(function(u){
    var c=mqtt.connect(u,{clientId:"n"+rid()+rid(),reconnectPeriod:3000,connectTimeout:8000});
    c.on("connect",function(){c.subscribe(topic);nbUpd();if(isHost)bcast()});
    c.on("close",nbUpd);c.on("error",function(){});
    c.on("message",function(t,pl){
      var m;try{m=JSON.parse(pl.toString())}catch(e){return}
      if(!m||!m.id||seen[m.id]||m.from===myPeer||(m.to&&m.to!==myPeer))return;
      seen[m.id]=1;onMsg(m);
    });
    clients.push(c);
  });
  nbUpd();
  if(host){
    S.host=myPeer;S.players[myPeer]={name:myName,score:0};render();
    setTimeout(function(){if(noServers()){err="Не удалось подключиться к серверам (возможна блокировка, попробуйте VPN).";S=null;status="";render()}},15000);
  }else{
    var n=0,hi=setInterval(function(){
      if(S&&S.players[myPeer]){clearInterval(hi);return}
      if(++n>15){clearInterval(hi);err=noServers()?"Не удалось подключиться к серверам (возможна блокировка, попробуйте VPN).":"Комната не найдена. Проверьте код и что хозяин не закрыл вкладку.";S=null;status="";render();return}
      sendMsg({t:"hello",d:{n:myName}});
    },2000);
  }
}

app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="create"||a==="join"){
    var n=document.getElementById("nm").value.trim();if(!n){err="Введите имя.";render();return}
    myName=n;
    if(a==="create"){code=mkCode();S={code:code,phase:"lobby",players:{},order:[],turn:0,votes:{},card:["",""],gain:0,host:null};status="Создаём комнату…";render();enter(true)}
    else{var c=document.getElementById("cd").value.trim().toUpperCase();if(c.length!==4){err="Код состоит из 4 букв.";render();return}code=c;status="Подключаемся…";render();enter(false)}
    return;
  }
  if(a==="start"){startGame();bcast();render()}
  else if(a==="again"){S.phase="lobby";bcast();render()}
  else if(a==="done"){act("done",{})}
  else if(a==="vote"){act("vote",{s:Number(b.getAttribute("data-s"))})}
  else if(a==="next"){S.turn++;if(S.turn>=S.order.length)S.phase="end";else newCard();bcast();render()}
});
render();
</script>
</body>
</html>
